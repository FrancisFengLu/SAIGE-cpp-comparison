# Multi-trait single-variant testing — config template.
#
# The `models:` sequence replaces the scalar modelFile / varianceRatioFile /
# outputFile trio. The two forms are MUTUALLY EXCLUSIVE: writing both is an
# error, never a silent preference for one.
#
# One entry == one trait == one output file, with exactly the columns and
# header a single-trait run of that model would produce. Row sets are identical
# across the files (QC is per marker and shared), so the files line up row for
# row without any alignment step.
#
# A one-entry `models:` is just a single-trait run: it takes the same code path
# and produces byte-identical output to the scalar form.

genoType:   plink
plinkFile:  /path/to/geno_prefix

models:
  - traitName: y1                                    # optional; defaults to the model dir name
    modelFile:         /path/to/step1_y1_out_dir     # dir with *.arma + nullmodel.json
    varianceRatioFile: /path/to/step1_y1.varianceRatio.txt
    outputFile:        /path/to/single_out.y1.txt
  - traitName: y2
    modelFile:         /path/to/step1_y2_out_dir
    varianceRatioFile: /path/to/step1_y2.varianceRatio.txt
    outputFile:        /path/to/single_out.y2.txt
    # These five keys may be written at the top level (all traits) or inside one
    # model (that trait only, beating the top-level value):
    #   is_Firth_beta, pCutoffforFirth, isnoadjCov,
    #   cateVarRatioMinMACVecExclude, cateVarRatioMaxMACVecInclude
    is_Firth_beta: true
    pCutoffforFirth: 0.05

# Everything below is per run, shared by every trait.
minMAF: 0
minMAC: 0.5
maxMissRate: 0.15
AlleleOrder: alt-first
isMoreOutput: true
isFirth: true
MACCutoffforER: 4
nThreads: 16

# --- batch kernel (multi-trait only; none of these change the numbers) -------
# mtBatch: false sends every (marker, trait) pair down the per-pair scalar
#   path. Output is identical either way -- it exists so a numerical surprise
#   can be attributed to the kernel or ruled out of it in one run.
# mtBlockSize: markers per block. Only moves the block boundaries; a run at 32
#   and a run at 512 are byte-identical.
# mtMemBudgetGB: total block scratch across all threads when mtBlockSize is
#   absent. Cost is about 16 bytes per (sample, block column) per thread.
mtBatch: true
# mtBlockSize: 0        # 0 / absent = pick from mtMemBudgetGB
mtMemBudgetGB: 1.5
# mtVecQuantStats: true
#   QUANTITATIVE traits only, default ON (since 2026-10-06). Runs the per-(marker, trait) tail --
#   Beta / seBeta / the chi-square(1) upper tail / the "%.6E" string -- one
#   marker block at a time instead of one pair at a time (score_vec.hpp).
#   Every pair with p < 1e-5, and every degenerate pair, still goes through the
#   same format_score_result the scalar path calls, so the tail is bit
#   identical; above 1e-5 the two p-values agree to 1.5e-15 relative. Binary
#   traits are untouched (their tail feeds the SPA / ER / Firth gates).
# --- defaults (2026-10-06, S2_DEFAULTS.md) ------------------------------------
# Default ON; write false to turn one off. All of them false = the old defaults,
# byte for byte.
#   mtPopcountAF, mtPopcountCtrlFromTotal, spaScratch, parallelModelLoad  (output unchanged)
#   mtFoldQuantProj, mtFuseGemm, mtVecQuantStats   (quantitative: last printed digit of a few rows)
#   blockSparseSigma   (sparse-GRM models: exact block inverse instead of PCG on the
#                       sparse-variance pairs. Binary: p moves by <= 3e-4 relative;
#                       quantitative: the PCG's var was off by up to 1.6%, so p moves by
#                       up to 19% relative (|d log10 p| <= 0.074) -- toward the exact value)
# useGPU stays false. With useGPU: true these default ON as well (write false to
# turn one off): gpuBinary, gpuSpa (gpuSpaImpl: lib), gpuFirth, gpuSparse,
# gpuOwnSampleSets, gpuPrefetch (gpuPrefetchThreads: 4), gpuSpaOrder: trait,
# gpuSpaDynamic, gpuSpaFused, gpuSpaMinBlocks: 3, gpuDecodeX2, gpuOverlap
# (S2_OVERLAP.md), gpuER (S2_ER_GPU.md; a startup self-check keeps ER on the CPU
# when the device cannot match the host's exp / log bit for bit).
# useGPU: true
# mtRequireSameSamples: true   # the only accepted value; false is refused
#                              # rather than silently ignored

# Constraints (see MULTITRAIT_DESIGN.md section 4.3):
#   - all models must share the same sample IDs, in the same order
#   - all models must agree on impute_method
#   - covariate count p may differ per trait; trait types may be mixed
#   - LOCO: `chrom` is global; each trait reads its own <modelDir>/chr<N>/
#   - region / gene-based testing with P > 1 is not supported
