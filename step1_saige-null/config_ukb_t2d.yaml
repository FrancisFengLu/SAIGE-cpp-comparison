# Config for UKB T2D (PheCode X250.2) Step 1 null model — BINARY trait
# 1000 random white-British, ~83 cases / ~909 controls / 8 missing
# Dense GRM from LD-pruned UKB array (408,970 samples x 340,447 SNPs)
paths:
  plinkFile: /media/leelabsg-storage0/DATA/UKBB/cal/pruned/output/ukb_allchr_v2_newID_passedQC_white.British_geno0.05_poly_500_50_0.2.pruned
  fam: /media/leelabsg-storage0/seokho/ukb_allchr_v2_newID_passedQC_white.British_geno0.05_poly_500_50_0.2.pruned.mapped.fam
  out_prefix: /media/leelabsg-storage0/seokho/seokho92-SAIGE-cpp-comparison/output/ukb_t2d_dense_output
  out_prefix_vr: /media/leelabsg-storage0/seokho/seokho92-SAIGE-cpp-comparison/output/ukb_t2d_dense_vr
  sparse_grm: ""
  sparse_grm_ids: ""
  overwrite_varratio: true

design:
  csv: /media/leelabsg-storage0/seokho/SAIGE-cpp-comparison/ukb_exp/Basic_trait_with_PheCode_table_ICD10_081123_whites_batches_famFiltered_random1000.tsv
  iid_col: eid
  y_col: X250.2
  covar_cols:
    - Sex
    - Age
    - Batch
    - PC1
    - PC2
    - PC3
    - PC4
  q_covar_cols:
    - Sex

fit:
  trait: binary
  covariate_offset: true   # re-enabled now that fit_covariate_offset has proper IRLS convergence + step halving
  loco: false
  nthreads: 1
  maxiter: 20
  tol: 0.02
  tolPCG: 1e-5
  maxiterPCG: 500
  nrun: 30
  num_markers_for_vr: 0  # 0 → skip VR estimation entirely (matches R --skipVarianceRatioEstimation=TRUE)
  use_sparse_grm_to_fit: false
  use_pcg_with_sparse_grm: false
  relatedness_cutoff: 0.125
  overwrite_vr: true
